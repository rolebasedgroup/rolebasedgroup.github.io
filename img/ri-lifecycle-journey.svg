<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 486" role="img" aria-labelledby="title desc">
  <title id="title">服务更新与删除时需要完成的操作</title>
  <desc id="desc">上半部分是更新流程：服务下线，停止接收新请求并排空正在处理的请求，保存 KVCache，更新服务并等待就绪，恢复 KVCache，重新上线接收请求。下半部分是删除流程：服务下线，停止接收新请求并排空正在处理的请求，保存 KVCache，最后停止服务。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .sub { fill: #596981; font-size: 15px; }
      .label { font-size: 15px; font-weight: 700; }
      .node { fill: #fff; stroke: #d8e0ec; stroke-width: 1.5; }
      .name { fill: #17233d; font-size: 21px; font-weight: 650; text-anchor: middle; }
      .detail { fill: #596981; font-size: 15px; text-anchor: middle; }
      .edge { fill: none; stroke: #66758d; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#66758d"/></marker>
  </defs>
  <rect width="1120" height="486" rx="20" fill="#f8fafc"/>
  <g transform="translate(0 -74)">
  <rect x="24" y="98" width="1072" height="222" rx="16" fill="#eef4ff" stroke="#ccd9f0"/>
  <text class="label" x="44" y="130" fill="#385fa0">更新流程</text>
  <rect class="node" x="44" y="156" width="196" height="118" rx="12"/>
  <text class="name" x="142" y="190">服务下线</text>
  <text class="detail" x="142" y="221">停止接收新请求</text>
  <text class="detail" x="142" y="247">排空正在处理的请求</text>
  <path class="edge" d="M244 215 H274"/>
  <rect class="node" x="280" y="156" width="168" height="118" rx="12"/>
  <text class="name" x="364" y="201">保存 KVCache</text>
  <text class="detail" x="364" y="233">保存当前缓存</text>
  <path class="edge" d="M452 215 H482"/>
  <rect x="488" y="156" width="168" height="118" rx="12" fill="#eeefff" stroke="#c8ccef" stroke-width="1.5"/>
  <text class="name" x="572" y="201">更新服务</text>
  <text class="detail" x="572" y="233">等待服务就绪</text>
  <path class="edge" d="M660 215 H690"/>
  <rect class="node" x="696" y="156" width="168" height="118" rx="12"/>
  <text class="name" x="780" y="201">恢复 KVCache</text>
  <text class="detail" x="780" y="233">加载之前保存的缓存</text>
  <path class="edge" d="M868 215 H898"/>
  <rect x="904" y="156" width="172" height="118" rx="12" fill="#eaf8f4" stroke="#bfe2d8" stroke-width="1.5"/>
  <text class="name" x="990" y="201">服务上线</text>
  <text class="detail" x="990" y="233">重新接收请求</text>
  <text class="sub" x="44" y="302">先完成下线、请求排空和缓存保存，再更新服务。</text>

  <rect x="24" y="344" width="1072" height="192" rx="16" fill="#fff7e8" stroke="#efdab2"/>
  <text class="label" x="44" y="376" fill="#8b5715">删除流程</text>
  <rect class="node" x="44" y="398" width="304" height="114" rx="12"/>
  <text class="name" x="196" y="432">服务下线</text>
  <text class="detail" x="196" y="462">停止接收新请求</text>
  <text class="detail" x="196" y="488">排空正在处理的请求</text>
  <path class="edge" d="M352 455 H402"/>
  <rect class="node" x="408" y="398" width="304" height="114" rx="12"/>
  <text class="name" x="560" y="443">保存 KVCache</text>
  <text class="detail" x="560" y="477">保存当前缓存</text>
  <path class="edge" d="M716 455 H766"/>
  <rect x="772" y="398" width="304" height="114" rx="12" fill="#fff0ed" stroke="#eacbc4" stroke-width="1.5"/>
  <text class="name" x="924" y="443">停止服务</text>
  <text class="detail" x="924" y="477">结束服务进程</text>
  </g>
</svg>