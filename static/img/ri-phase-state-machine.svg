<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="ri-title ri-desc">
  <title id="ri-title">RI phase 状态机</title>
  <desc id="ri-desc">创建期间的目标变化在本轮创建中处理，Creating 完成后进入 Running。Running 可进入 Updating 或 Recovering，二者完成后返回 Running；Recovering 可进入 Updating。任何非终止状态都可因实例删除进入 Terminating。Running 表示本轮实例操作完成，不保证当前 Ready 或后台业务已完成。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .state-node { fill: #fff; stroke: #9db2d2; stroke-width: 1.4; }
    .state-node.running { fill: #e5f6f2; stroke: #58a99c; }
    .state-node.progressing, .state-node.recovering { fill: #fff5df; stroke: #d6a34d; }
    .state-node.terminating { fill: #fff0f1; stroke: #d58b91; }
    .state-name { fill: #172033; font-size: 14px; font-weight: 750; text-anchor: middle; }
    .state-subtitle { fill: #5d6b82; font-size: 10px; text-anchor: middle; }
    .state-edge { fill: none; stroke: #2558d8; stroke-width: 1.6; }
    .state-edge.return { stroke: #087f75; }
    .state-edge.delete { stroke: #b33a43; stroke-dasharray: 6 4; }
    .state-label { fill: #43536b; font-size: 10px; text-anchor: middle; }
  </style>
  <defs>
    <marker id="ri-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2558d8"/></marker>
    <marker id="ri-return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f75"/></marker>
    <marker id="ri-delete" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b33a43"/></marker>
  </defs>
  <rect class="state-node" x="25" y="132" width="170" height="74" rx="14"/>
  <text class="state-name" x="110" y="163">Creating</text>
  <text class="state-subtitle" x="110" y="184">首次建立工作负载</text>
  <rect class="state-node" x="280" y="30" width="190" height="74" rx="14"/>
  <text class="state-name" x="375" y="61">Updating</text>
  <text class="state-subtitle" x="375" y="82">工作负载更新</text>
  <rect class="state-node recovering" x="280" y="235" width="190" height="74" rx="14"/>
  <text class="state-name" x="375" y="266">Recovering</text>
  <text class="state-subtitle" x="375" y="287">独立重建或替换 Pod</text>
  <rect class="state-node running" x="565" y="132" width="170" height="74" rx="14"/>
  <text class="state-name" x="650" y="163">Running</text>
  <text class="state-subtitle" x="650" y="184">本轮实例操作完成</text>
  <rect class="state-node terminating" x="825" y="132" width="150" height="74" rx="14"/>
  <text class="state-name" x="900" y="174">Terminating</text>
  <path class="state-edge" d="M195 169 H561" marker-end="url(#ri-arrow)"/>
  <text class="state-label" x="430" y="153">创建完成</text>
  <path class="state-edge" d="M565 146 L470 88" marker-end="url(#ri-arrow)"/>
  <path class="state-edge return" d="M470 76 L565 134" marker-end="url(#ri-return)"/>
  <text class="state-label" x="530" y="75">更新 / 完成</text>
  <path class="state-edge" d="M565 192 L470 252" marker-end="url(#ri-arrow)"/>
  <path class="state-edge return" d="M470 264 L565 204" marker-end="url(#ri-return)"/>
  <text class="state-label" x="530" y="271">恢复 / 完成</text>
  <path class="state-edge" d="M280 272 C225 272 225 105 276 105" marker-end="url(#ri-arrow)"/>
  <text class="state-label" x="238" y="112">恢复期间开始更新</text>
  <path class="state-edge delete" d="M735 169 H821" marker-end="url(#ri-delete)"/>
  <text class="state-label" x="778" y="152">删除实例</text>
  <path class="state-edge delete" d="M470 48 H900 V128" marker-end="url(#ri-delete)"/>
  <path class="state-edge delete" d="M470 272 H900 V210" marker-end="url(#ri-delete)"/>
  <path class="state-edge delete" d="M110 206 V330 H900 V210" marker-end="url(#ri-delete)"/>
</svg>
